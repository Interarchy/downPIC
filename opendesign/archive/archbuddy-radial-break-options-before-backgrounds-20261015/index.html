<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArchBuddy · 01 断点环三版比较</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand-mark.svg">

</head>
<body>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="#one" aria-label="ArchBuddy 断点环比较"><img src="assets/brand-mark.svg" width="32" height="32" alt=""><span>ArchBuddy</span></a><span class="header-context">01 图示细节 · 本地比较</span></div></header>
  <main class="container">
    <nav class="options" aria-label="切换三种弧排图面方案">
      <button type="button" data-option="one" aria-pressed="true"><span class="option-no">1</span><span><strong>素纸细线</strong><small>柔和绿阶 · 细短虚线</small></span></button>
      <button type="button" data-option="two" aria-pressed="false"><span class="option-no">2</span><span><strong>林绿方格</strong><small>递进深绿 · 紧密方块</small></span></button>
      <button type="button" data-option="three" aria-pressed="false"><span class="option-no">3</span><span><strong>留白轻环</strong><small>更薄环带 · 细密虚线</small></span></button>
    </nav>
    <p class="option-description" id="option-description" aria-live="polite">素纸细线：柔和鼠尾草绿，细短虚线，完整环带。</p>
    <section class="problem-section" aria-labelledby="problem-title">
      <div class="section-heading"><p class="section-label"><span>01</span>方案创作中的断点</p><h1 id="problem-title">方案创作是连续的，<br>工作流程却常常断开。</h1></div>
      <div class="radial-layout treatment-one" id="radial-stage" aria-label="五步创作环及 A、B、C 三处工作断点">
        <div class="radial-visual"><div class="radial-disc"><svg id="ring-svg" class="ring-svg" role="img" aria-label="五步方案创作过程及 A、B、C 三处断点" xmlns="http://www.w3.org/2000/svg"></svg></div></div>        <div class="diagnoses"><ol aria-label="三个工作断点的解释">
          <li class="diagnosis"><span class="diagnosis-id">A</span><div><h2>保存打断思路</h2><p>逐张保存占用注意，<br>创作时参考难找回。</p></div></li>
          <li class="diagnosis"><span class="diagnosis-id">B</span><div><h2>意图难以表达</h2><p>提示词从零编写，<br>多轮修改缺少依据。</p></div></li>
          <li class="diagnosis"><span class="diagnosis-id">C</span><div><h2>成果难以复用</h2><p>图片与提示词堆积，<br>下次创作难以复用。</p></div></li>
        </ol></div>
      </div>
    </section>
  </main>
  <footer class="container footer"><span>仅供本地选择 · 三版均未同步正式页面</span><a href="../../archive/archbuddy-radial-break-options-before-editorial-20261015/?round=9e#two">查看上一轮</a></footer>
