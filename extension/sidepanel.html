<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ArchBuddy</title>
  <link rel="stylesheet" href="sidepanel.css?v=0.5.2" />
</head>
<body class="needs-consent">
  <header class="app-header">
    <div class="brand"><img class="brand-mark" src="icons/icon-128.png" alt="" /><strong>ArchBuddy</strong><span class="beta">Beta</span></div>
    <p id="session-status">正在连接</p>
  </header>
  <nav class="tabs">
    <button class="tab" type="button" data-tab="download">图片采集</button>
    <button class="tab is-active" type="button" data-tab="analysis">提示词构建</button>
    <button class="tab" type="button" data-tab="optimize">效果优化</button>
  </nav>
  <main>
    <section id="analysis-panel" class="panel">
      <section id="privacy-gate" class="setup-block onboarding-gate" hidden>
        <h1>开始使用前确认</h1>
        <label class="check-row onboarding-check"><input id="privacy-check" type="checkbox" />
          <span><strong>我同意发送所选图片用于分析</strong><small>仅在点击“开始分析”时发送给 ArchBuddy 与 DeepSeek；我确认有权使用该图片。</small></span>
        </label>
        <div class="onboarding-actions"><a href="privacy.html" target="_blank">隐私说明</a><button id="privacy-accept" class="primary-button" disabled>确认</button></div>
      </section>
      <div class="builder-toolbar"><span>最多 3 张参考图</span><button id="new-builder" class="text-button">重新构建</button></div>
      <div id="reference-list" class="reference-list"></div>
      <button id="add-reference" class="secondary-button add-reference">添加参考图二</button>
      <p id="builder-feedback" class="section-note"></p>
      <section class="prompt-block builder-summary">
        <label class="draft-name-field" for="prompt-name">提示词名称<input id="prompt-name" maxlength="80" placeholder="例如：山地酒店 · 暖色混凝土" /></label>
        <div class="section-title"><h2>整体 Prompt 预览</h2><span id="prompt-count"></span></div>
        <p class="section-note">正文可直接编辑；上方替换只更新对应段落。</p>
        <div id="prompt-preview"></div>
        <div class="prompt-actions">
          <button id="confirm-prompt" class="secondary-button" disabled>整体确认</button>
          <button id="copy-prompt" class="primary-button" disabled>复制</button>
        </div>
        <textarea id="copy-fallback" class="copy-fallback" readonly hidden></textarea>
        <p id="copy-feedback" class="section-note"></p>
      </section>
      <details class="drafts-block drafts-panel">
        <summary>最近确认的提示词库</summary>
        <p class="section-note">整体确认后保存在本机，最多 5 份。</p>
        <div id="library-list" class="draft-list"></div>
      </details>
      <details class="details-panel">
        <summary>详细说明</summary>
        <p class="section-note">在参考图的各维度中编辑，点击“加入”或“替换”汇入整体预览。已选内容继续编辑时，预览同步更新。整体确认后再复制。</p>
        <label class="check-row"><input id="analytics-toggle" type="checkbox" />允许匿名功能统计（不包含图片和提示词）</label>
        <a href="privacy.html" target="_blank">隐私说明</a>
      </details>
    </section>
    <section id="download-panel" class="panel" hidden>
      <h1>图片采集</h1>
      <p class="section-note">选择网页图片，或拖入、粘贴本地图片。</p>
      <figure id="capture-preview" class="preview is-empty" tabindex="0">
        <img id="capture-image" hidden alt="待保存图片" />
        <figcaption id="capture-caption">选择一张图片</figcaption>
        <button id="capture-choose" class="secondary-button compact">选择文件</button>
        <input id="capture-file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
      </figure>
      <section class="field-group">
        <label for="preset-type">项目类型</label><select id="preset-type"></select>
        <div class="key-row"><input id="custom-type" maxlength="40" placeholder="新建分类" /><button id="save-type" class="secondary-button">设为默认</button></div>
        <p id="type-feedback" class="section-note"></p>
      </section>
      <section class="current-download">
        <button id="download-current" class="primary-button" disabled>保存图片</button>
        <p id="download-feedback" class="section-note"></p>
        <div class="prompt-actions"><button id="continue-analysis" class="secondary-button">用于构建</button><button id="show-download" class="secondary-button" disabled>定位文件</button></div>
        <p id="last-download-path" class="section-note"></p>
      </section>
    </section>
    <section id="optimize-panel" class="panel optimize-panel" hidden>
      <div class="section-title"><h2>生成效果图</h2><span>粘贴、拖入或选择文件</span></div>
      <figure id="generated-preview" class="preview is-empty" tabindex="0">
        <img id="generated-image" hidden alt="生成效果图" />
        <figcaption id="generated-caption">放入已经生成的效果图</figcaption>
        <button id="generated-choose" class="secondary-button compact">选择文件</button>
        <input id="generated-file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
      </figure>
      <section class="baseline-picker">
        <label for="scheme-select">选择已确认的基本提示词</label>
        <select id="scheme-select"><option value="">从最近确认的提示词库中选择</option></select>
        <details id="baseline-details" hidden><summary>查看原文</summary><pre id="baseline-prompt"></pre></details>
      </section>
      <label class="check-row evaluation-consent"><input id="evaluation-consent" type="checkbox" /><span>确认发送此生成图与所选提示词进行评估</span></label>
      <button id="run-evaluation" class="primary-button" disabled>开始评估</button>
      <p id="evaluation-feedback" class="section-note"></p>
      <section id="evaluation-report" hidden>
        <div class="section-title"><h2>评估与调整</h2><span>在原文中直接编辑</span></div>
        <p id="overall-conclusion" class="section-note"></p>
        <div id="finding-list" class="finding-list"></div>
        <div class="prompt-actions"><button id="confirm-revision" class="secondary-button">确认修改</button><button id="copy-revision" class="primary-button" disabled>复制</button></div>
        <textarea id="revision-copy-fallback" class="copy-fallback" readonly hidden></textarea>
        <p id="revision-feedback" class="section-note"></p>
      </section>
    </section>
  </main>
  <script type="module" src="sidepanel.mjs"></script>
</body>
</html>
