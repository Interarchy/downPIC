<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ArchBuddy</title>
    <link rel="stylesheet" href="popup.css?v=0.2.3" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="brand-row">
        <div class="brand"><img class="brand-mark" src="icons/icon-128.png" alt="" /><strong>ArchBuddy</strong><span>Beta</span></div>
        <p id="backend-status" data-state="checking"><i></i><span>检查服务</span></p>
      </header>

      <section class="switch-row">
        <div><strong id="capture-title">打开图片浏览器下载浮框</strong><p id="capture-copy">功能已关闭</p></div>
        <label class="switch">
          <span class="sr-only">打开或关闭图片浏览器下载浮框</span>
          <input id="capture-enabled" type="checkbox" />
          <span class="switch-track"></span>
        </label>
      </section>

      <button id="open-analysis" class="analysis-button" type="button">
        <span><strong>反馈提示词</strong><small>粘贴图片，或查看网页选图结果</small></span>
        <b aria-hidden="true">›</b>
      </button>

      <button id="open-optimize" class="analysis-button" type="button">
        <span><strong>提示词迭代优化</strong><small>对照已确认提示词，调整生成效果</small></span>
        <b aria-hidden="true">›</b>
      </button>
      <button id="open-library" class="analysis-button" type="button">
        <span><strong>打开图词库</strong><small>查看采集图片与生成的提示词</small></span>
        <b aria-hidden="true">›</b>
      </button>

      <p class="usage-note">开启后，将鼠标移到网页内容图片上，即可保存或反推提示词。</p>
      <p id="global-feedback" class="feedback" aria-live="polite"></p>
      <a class="privacy-link" href="privacy.html" target="_blank">隐私说明</a>
    </main>
    <script type="module" src="popup.mjs"></script>
  </body>
</html>
